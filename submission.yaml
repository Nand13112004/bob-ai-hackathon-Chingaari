submission:
  title: "GridSentinel - Power Outage Prediction & Advisor"

  problem_statement: >
    Utility teams need to identify transformer failure risks before outages
    occur. Manual analysis of sensor readings, weather conditions, incidents,
    maintenance history and transformer information makes proactive
    maintenance difficult and time-consuming.

  solution_summary: >
    GridSentinel combines historical transformer and sensor data with machine
    learning to predict transformer failure risk for the next seven days.
    Users can either upload a CSV containing multiple transformers for batch
    prediction or enter a particular transformer ID for an individual risk
    assessment.

  key_features:
    - "7-day transformer failure risk prediction using machine learning"
    - "CSV batch prediction for multiple transformers"
    - "Individual transformer ID risk analysis"
    - "Maintenance recommendations based on predicted risk"
    - "Crew recommendation and grid impact analysis"
    - "IBM Bob conversational interface"